# Memory Promotion Rules (Lawbook 25장)

r1_distillation:
  verification_axes:
    - hallucination: "원본에 없는 내용이 증류에 포함됐는가"
    - information_loss: "핵심 수치/결론이 누락됐는가"
    - distortion: "수치/판단이 왜곡됐는가"
  auto_trigger: true
  description: "R0 저장 시 자동으로 R1 증류"

r2_family_memory:
  trigger: "동일 family에서 3개 이상 R1 실험"
  min_experiments: 3
  fields:
    - family_name
    - n_experiments
    - grade_distribution
    - best_sharpe
    - mechanisms
    - lessons_summary

r3_statistical_evidence:
  trigger: "Auditor가 통계 검증 완료"
  required_methods: ["dsr"]
  optional_methods: ["fdr", "reality_check", "bootstrap"]
  stored_by: "auditor"

r4_regime_payoff:
  trigger: "Regime 에이전트가 국면별 성과 분석 완료"
  min_regime_months: 24
  confidence_levels:
    low: 0.3
    medium: 0.5
    high: 0.7
  stored_by: "regime"

r5_portfolio_policy:
  trigger: "Blender가 포트폴리오 조합/배분 정책 확정"
  required: "baseline 대비 개선 확인"
  stored_by: "blender"

r6_post_trade:
  trigger: "이론적 사후 성과 축적 (월간)"
  stored_by: "monitor/tower"
