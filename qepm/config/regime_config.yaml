# QEPM Regime Configuration
# 기존 02_Infrastructure/regime_engine.R + regime_signal.R + regime_combined.R 설정 통합
# 원본 인프라 수정 없음 — 스킬 어댑터가 이 설정을 읽어 사용

models:
  mrs:
    # Markov Regime Switching (FRED 매크로 기반)
    cashout_threshold: 30      # MRS >= 30 → RISK_OFF (L-82, L-84, L-86)
    caution_threshold: 15      # 15 <= MRS < 30 → CAUTION
    cooldown_months: 2         # 국면 전환 후 대기 (L-72, L-75)

  cross_asset:
    # TS + HY + VIX 동시 강화 (L-143, L-144)
    z_threshold: 2.0
    signals:
      - name: term_spread
        description: "10Y-2Y 금리차"
      - name: high_yield
        description: "HY-IG 스프레드"
      - name: vix
        description: "VIX 레벨"

  endogenous:
    # 내생 국면 엔진 (regime_engine.R)
    n_regimes: 4
    n_pcs: 3
    rolling_months: 60
    min_months: 36

  bcs:
    # Bull-Bear Composite Signal
    correlation: -0.143    # 시장 수익률과 상관
    lead_periods:
      covid: 80            # COVID 80일 선행
      rate_hike: 181       # 금리인상 181일 선행

  combined:
    # FRED + MSM AND-gate (최고 성과: CAGR +3.29%p)
    method: "or_gate"      # or_gate | weighted | bayesian
    fred_threshold: 30
    msm_threshold: 0.5
    precision: 0.432

regime_categories:
  RISK_ON:
    cash_allocation: 0.0
    description: "전면 투자"
  CAUTION:
    cash_allocation: 0.3
    description: "방어적 배분"
  RISK_OFF:
    cash_allocation: 1.0
    description: "현금 전환 (MRS >= 30)"

# 국면별 팩터 가중 조정
factor_adjustments:
  RISK_ON:
    momentum: 1.0
    value: 1.0
    quality: 1.0
    defense: 0.8
  CAUTION:
    momentum: 0.5
    value: 1.2
    quality: 1.3
    defense: 1.5
  RISK_OFF:
    momentum: 0.0
    value: 0.5
    quality: 1.0
    defense: 2.0
