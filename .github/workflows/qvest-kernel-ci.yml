name: Qvest Kernel CI

# v7.0 Sprint 2 — Kernel-only CI (light, no R full execution).
# Plan: nifty-tickling-hinton.md Sprint 2.
#
# 9 jobs:
#   1. hook_dry_run     — bash 08_Tests/hooks/run_all_hooks.sh (30/30)
#   2. router_selftest  — python3 qvest_hook_router.py selftest
#   3. cert_eval_selftest — python3 qvest_cert_eval.py selftest
#   4. state_machine_selftest — Rscript -e 'qvest_state_machine_selftest()'
#   5. cert_rules_selftest    — Rscript -e 'qvest_cert_rules_selftest()'
#   6. r_syntax_parse   — parse(file=...) only (NO source, NO library load)
#   7. shellcheck       — find hooks/*.sh | xargs shellcheck
#   8. python_lint      — pyright on router + cert_eval (light)
#   9. duplication_audit — eligibility logic 중복 0건 검증

on:
  push:
    branches:
      - master
      - 'v7.0-*'
      - 'v7.1-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  CLAUDE_PROJECT_DIR: ${{ github.workspace }}

jobs:
  hook_dry_run:
    name: Hook dry-run (30 hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Install jsonlite + data.table
        run: Rscript -e 'install.packages(c("jsonlite","data.table"), repos="https://cloud.r-project.org")'
      - name: Run all hooks
        run: bash 08_Tests/hooks/run_all_hooks.sh

  router_selftest:
    name: qvest_hook_router selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run router selftest
        run: python3 02_Infrastructure/hooks/qvest_hook_router.py selftest

  cert_eval_selftest:
    name: qvest_cert_eval selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run cert_eval selftest
        run: python3 02_Infrastructure/hooks/qvest_cert_eval.py selftest

  state_machine_selftest:
    name: state_machine selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Run state_machine selftest
        run: Rscript -e 'source("02_Infrastructure/worktask/state_machine.R"); ok <- qvest_state_machine_selftest(); if (!isTRUE(ok)) quit(status=1)'

  cert_rules_selftest:
    name: cert_rules selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Run cert_rules selftest
        run: Rscript -e 'source("02_Infrastructure/worktask/cert_rules.R"); ok <- qvest_cert_rules_selftest(); if (!isTRUE(ok)) quit(status=1)'

  r_syntax_parse:
    name: R syntax parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - name: Parse all R files (NO source, NO library load)
        run: |
          Rscript -e '
          # Codex CI 권고: source() 금지, parse(file=) only.
          dirs <- c("02_Infrastructure", "08_Tests")
          dirs <- dirs[dir.exists(dirs)]
          files <- unlist(lapply(dirs, function(d)
            list.files(d, pattern="\\.R$", recursive=TRUE, full.names=TRUE)))
          fails <- character()
          for (f in files) {
            out <- tryCatch(parse(file=f), error=function(e) conditionMessage(e))
            if (inherits(out, "character")) {
              fails <- c(fails, sprintf("%s: %s", f, out))
            }
          }
          cat(sprintf("Parsed %d R files, %d errors\n", length(files), length(fails)))
          if (length(fails) > 0) {
            for (f in fails) cat("  FAIL:", f, "\n")
            quit(status=1)
          }
          '

  shellcheck:
    name: Shellcheck (hook .sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on hooks
        run: |
          set -e
          fails=0
          for f in 02_Infrastructure/hooks/*.sh; do
            # SC2086 quoting / SC1090 source non-constant — soft skip
            shellcheck -e SC2086,SC1090,SC1091,SC2046,SC2155 "$f" || fails=$((fails+1))
          done
          if [ "$fails" -gt 0 ]; then
            echo "Shellcheck found $fails files with issues"
            exit 1
          fi

  python_lint:
    name: Python lint (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyright
        run: pip install pyright
      - name: Run pyright on router + cert_eval (kernel only)
        run: |
          pyright --warnings 02_Infrastructure/hooks/qvest_hook_router.py 02_Infrastructure/hooks/qvest_cert_eval.py

  schema_validate:
    name: Schema validation (named REQUIRED_SCHEMAS set, 15 v7.2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Smoke test named REQUIRED_SCHEMAS set (parse + structure validity)
        run: |
          set -e
          python3 -c "
          import json, sys
          from pathlib import Path
          # v7.2.1 — named set 의무 (hardcoded count 제거)
          REQUIRED_SCHEMAS = {
              'packages/alpha_package_schema.json',
              'packages/risk_package_schema.json',
              'packages/optimization_package_schema.json',
              'packages/forge_package_schema.json',
              'packages/judge_verdict_schema.json',
              'packages/governor_admission_schema.json',
              'certs/alpha_discovery_certificate_schema.json',
              'certs/sr_provenance_certificate_schema.json',
              'certs/schedule_fidelity_certificate_schema.json',
              'certs/forge_package_validated_certificate_schema.json',
              'certs/governor_concord_certificate_schema.json',
              'state/book_state_schema.json',
              'state/governance_log_schema.json',
              'state/artifact_lineage_schema.json',
              'state/axiom_schema.json',
          }
          schemas_dir = Path('02_Infrastructure/schemas')
          if not schemas_dir.exists():
              print('schemas dir not found'); sys.exit(1)
          import jsonschema
          missing = []
          for rel in REQUIRED_SCHEMAS:
              p = schemas_dir / rel
              if not p.exists():
                  missing.append(rel); continue
              try:
                  with open(p) as f:
                      schema = json.load(f)
                  jsonschema.Draft7Validator.check_schema(schema)
              except Exception as e:
                  print(f'INVALID schema {p}: {e}'); sys.exit(1)
          if missing:
              print(f'Missing required schemas: {missing}'); sys.exit(1)
          print(f'All {len(REQUIRED_SCHEMAS)} REQUIRED_SCHEMAS valid Draft-07 ✅')
          "
      - name: Validate router validate-schema CLI
        run: |
          set -e
          # synthetic test: invalid alpha_package missing task_id
          echo '{"as_of_date":"2026-05-01"}' > /tmp/bad_alpha.json
          python3 02_Infrastructure/hooks/qvest_hook_router.py validate-schema --schema alpha_package --package /tmp/bad_alpha.json && exit 1 || echo "✅ Invalid fixture rejected as expected"
      - name: Validate examples/qvest_workflows/ (whitelist mapping)
        run: |
          # v7.1-lite Sprint 4.4 — examples schema validation (도훈 지적 #6)
          python3 -c "
          import json, jsonschema, sys
          from pathlib import Path
          # Whitelist file_name → schema_path (단순 stem 추론 X)
          MAPPING = {
              'alpha_package.json': 'packages/alpha_package_schema.json',
              'risk_package.json': 'packages/risk_package_schema.json',
              'optimization_package.json': 'packages/optimization_package_schema.json',
              'forge_package.json': 'packages/forge_package_schema.json',
              'judge_verdict.json': 'packages/judge_verdict_schema.json',
              'governor_admission.json': 'packages/governor_admission_schema.json',
              'alpha_discovery_certificate.json': 'certs/alpha_discovery_certificate_schema.json',
              'sr_provenance_certificate.json': 'certs/sr_provenance_certificate_schema.json',
              'schedule_fidelity_certificate.json': 'certs/schedule_fidelity_certificate_schema.json',
              'forge_package_validated_certificate.json': 'certs/forge_package_validated_certificate_schema.json',
              'governor_concord_certificate.json': 'certs/governor_concord_certificate_schema.json',
              'governance_log.json': 'state/governance_log_schema.json',
          }
          # Skip list (전용 schema 없음)
          SKIP = {'status.json', 'request.json', 'expected_timeline.json'}
          schemas_root = Path('02_Infrastructure/schemas')
          ex_root = Path('02_Infrastructure/docs/examples/qvest_workflows')
          if not ex_root.is_dir():
              print('02_Infrastructure/docs/examples/qvest_workflows/ 부재 — skip')
              sys.exit(0)
          fail = 0
          validated = 0
          skipped = 0
          for f in ex_root.rglob('*.json'):
              fn = f.name
              if fn in SKIP:
                  skipped += 1
                  continue
              if fn not in MAPPING:
                  print(f'  [SKIP] {f} — no whitelist entry')
                  skipped += 1
                  continue
              schema_path = schemas_root / MAPPING[fn]
              if not schema_path.exists():
                  print(f'  [FAIL] schema not found: {schema_path}'); fail += 1; continue
              try:
                  schema = json.load(open(schema_path))
                  data = json.load(open(f))
                  jsonschema.validate(data, schema)
                  validated += 1
              except jsonschema.ValidationError as e:
                  print(f'  [FAIL] {f}: {e.message[:120]}'); fail += 1
              except Exception as e:
                  print(f'  [FAIL] {f}: {e}'); fail += 1
          print(f'examples/qvest_workflows: {validated} validated / {skipped} skipped / {fail} failed')
          sys.exit(0 if fail == 0 else 1)
          "

  search_smoke:
    name: qvest_search smoke (v7.1-lite Sprint 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: build search index (--dry-run smoke)
        run: |
          Rscript 02_Infrastructure/search/build_index.R --dry-run 2>&1 | tee /tmp/build_dry.log
          # Verify all 9 source builders ran (no 'ERROR' lines)
          if grep -E "^\[ERROR\]" /tmp/build_dry.log; then
            echo "build_index FAIL — ERROR lines detected"; exit 1
          fi
      - name: build full index
        run: Rscript 02_Infrastructure/search/build_index.R
      - name: query smoke — STR_1715
        run: |
          QVEST_SEARCH_AUTO_REBUILD=0 bash 02_Infrastructure/search/qvest_search "STR_1715" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('count',0) >= 1, f'expected >=1 STR_1715 hit, got {d}'; print(f\"STR_1715 hits: {d['count']}\")"
      - name: query smoke — AX-002 type=axiom
        run: |
          QVEST_SEARCH_AUTO_REBUILD=0 bash 02_Infrastructure/search/qvest_search "AX-002" --type axiom \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('count',0) >= 1, f'expected >=1 AX-002 axiom hit'; print(f\"AX-002 axiom hits: {d['count']}\")"
      - name: synthetic WT default exclusion
        run: |
          QVEST_SEARCH_AUTO_REBUILD=0 bash 02_Infrastructure/search/qvest_search "WT-D9999" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('count',0) == 0, f'WT-D9999 should be 0 default, got {d}'; print('WT-D9999 default exclusion OK')"

  qvest_wt_smoke:
    name: qvest_wt smoke (v7.1-lite Sprint 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: --recent 5 smoke
        run: |
          bash 02_Infrastructure/observability/qvest_wt --recent 5 2>&1 | tee /tmp/recent.log
          # Should not contain WT-D9999 (default exclusion)
          if grep -E "WT-D9999" /tmp/recent.log; then
            echo "FAIL: synthetic WT leaked into --recent default output"; exit 1
          fi
      - name: --json smoke (existing WT)
        run: |
          # Use any existing WT
          ANY_WT=$(ls qepm/mailbox/worktask/ | grep -vE "^WT-D9999" | head -1)
          if [ -n "$ANY_WT" ]; then
            bash 02_Infrastructure/observability/qvest_wt "$ANY_WT" --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('current_phase'), f'expected current_phase, got {d.get(\"current_phase\")}'; print(f\"WT $ANY_WT phase={d['current_phase']}\")"
          fi

  v8_readiness_smoke:
    name: v8.0 readiness gate smoke (v7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Integration test (12/12 PASS required)
        run: Rscript 08_Tests/integration/test_v8_readiness_gate.R
      - name: CLI --no-write smoke (PASS=0 or WARN=2 acceptable, FAIL=1 not)
        run: |
          set +e
          bash 02_Infrastructure/tools/qvest_v8_ready --no-write --json > /tmp/readiness.json
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "v8 readiness gate FAIL (exit 1) — kernel regression detected"
            cat /tmp/readiness.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for c in d.get('checks', []):
              if c['status'] == 'FAIL':
                  print(f'  [{c[\"status\"]}] {c[\"id\"]}: {c[\"details\"][:80]}')
          "
            exit 1
          fi
          echo "v8 readiness exit=$rc (0=PASS, 2=WARN — both acceptable in CI)"

  memory_health_smoke:
    name: Memory Knowledge Health Gate (v7.2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install jsonlite + jsonschema
        run: |
          Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
          pip install jsonschema
      - name: axiom_schema validate samples
        run: |
          set -e
          python3 02_Infrastructure/hooks/qvest_hook_router.py validate-schema --schema axiom --package qepm/memory/axioms/active/AX-007.json
          python3 02_Infrastructure/hooks/qvest_hook_router.py validate-schema --schema axiom --package qepm/memory/axioms/active/AX-008.json
          python3 02_Infrastructure/hooks/qvest_hook_router.py validate-schema --schema axiom --package qepm/memory/axioms/candidates/CAND_20260417_value_negative_L-132_L-135.json
      - name: memory_knowledge_health hard fail 0
        run: |
          set -e
          Rscript 02_Infrastructure/memory/memory_knowledge_health.R
          # rc=0 = PASS, rc=1 = FAIL (hard fail > 0)
      - name: qvest_search smoke (lesson + axiom_candidate)
        run: |
          set -e
          Rscript 02_Infrastructure/search/build_index.R
          # lesson type
          bash 02_Infrastructure/search/qvest_search "L-248" --type lesson \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('count',0) >= 1, f'lesson L-248 hit expected, got {d}'; print(f'lesson L-248: {d[\"count\"]} hits')"
          # axiom_candidate type
          bash 02_Infrastructure/search/qvest_search "value_negative" --type axiom_candidate \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('count',0) >= 1, f'axiom_candidate hit expected, got {d}'; print(f'axiom_candidate: {d[\"count\"]} hits')"
          # format_result authority/axiom_class fields
          bash 02_Infrastructure/search/qvest_search "AX-001" --type axiom \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d['results'][0]; assert r.get('authority') and r.get('axiom_class') and r.get('memory_kind'), f'expected enriched fields, got {r}'; print(f'AX-001 fields: authority={r[\"authority\"]} class={r[\"axiom_class\"]} kind={r[\"memory_kind\"]}')"

  duplication_audit:
    name: Duplication audit (single source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eligibility logic 중복 검사
        run: |
          # v7.0 Sprint 1 후: cert eligibility threshold가 hook 내 inline 작성되면 안 됨.
          # 0.95 / 50 chars / harvey_t 3 등 hardcode 금지 (cert_rules.json만).
          set -e
          # alpha_inheritance_cor < 0.95 hardcoded outside cert_rules.json/cert_rules.R/cert_eval.py?
          violations=$(grep -rEn "alpha_inheritance_cor.*<.*0\.95|harvey_t.*>=.*3" 02_Infrastructure/hooks/*.sh 02_Infrastructure/hooks/*.py 2>/dev/null | grep -vE "qvest_cert_eval\.py|qvest_hook_router\.py|cert_rules\.json" || true)
          if [ -n "$violations" ]; then
            echo "Duplication detected (eligibility logic outside cert_rules):"
            echo "$violations"
            exit 1
          fi
          echo "✅ No duplication — single source verified"
