# Qvest 기계 역할 — 두 대 운용(2026-11-01 도훈 지시: "둘 다 켜져 있을 땐 메인 PC 를 우선")
# 소비자: qvest_machine.sh (gate · heartbeat · settled) · qvest_tasks.ps1 (period 덮어쓰기)
#
# machine <COMPUTERNAME> <main|secondary>
#   목록에 없는 기계 = secondary. 한 기계만 잠시 바꾸려면 그 기계의 사용자 환경 변수 QVEST_MACHINE_ROLE.
#   여기 적힌 이름은 OneDrive 충돌 사본(<이름>-<기계명>) 탐지에도 쓰인다(대소문자 무시).
machine MAINCOMPUTER main
machine RAZER_BLADE_16 secondary

# period <예약 작업 이름> <day|week|month|hour|none|local>
#   예약 등록(qvest_tasks.ps1 -Mode Apply) 때 트리거에서 추정한 주기를 덮어쓴다.
#   local = 게이트 없이 기계마다 따로 돈다 — 그 기계 자신의 상태를 읽는 작업.
period Qvest_AuditWatch local
